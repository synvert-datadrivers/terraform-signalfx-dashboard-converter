on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.hcl'
      - 'examples/default-dashboard-export/**'
      - '.github/workflows/pull_request.yml'

permissions:
  contents: write # semantic relasese test write access even on dry-run
  pull-requests: write

jobs:
  terraform-tests:
    name: run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install terraform
        uses: datadrivers/terragrunt-action@v4
        env:
          TENV_GITHUB_TOKEN: ${{ github.token}}
        with:
          terraform-version: "latest"
          skip-caches: "false"
          enable-debug: "true"
      - name: run terraform
        run: |
            terraform init
            terraform test
  terraform-validate:
    needs:
      - terraform-tests
    name: Validate Example
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install terraform
        uses: datadrivers/terragrunt-action@v4
        env:
          TENV_GITHUB_TOKEN: ${{ github.token}}
        with:
          terraform-version: "latest"
          skip-caches: "false"
          enable-debug: "true"
      - name: run terraform
        run: |
          pushd examples/default-dashboard-export
          terraform init
          terraform plan -out terraform.tfplan
      - name: add PR comment with plan results
        if: ${{ github.event_name == 'pull_request' }}
        uses: datadrivers/terragrunt-action/terraform-pr-commenter@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
